# cava for the desktop visualizer (AudioVisualizer.qml): bar heights as
# text, one frame per line, read from PipeWire's monitor of what is playing.
# The shell runs it only while the visualizer is shown. Your own
# ~/.config/cava/config is not used or touched.
[general]
bars = 48
framerate = 60
autosens = 1

[input]
method = pipewire
source = auto

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 1000
bar_delimiter = 59
frame_delimiter = 10

[smoothing]
noise_reduction = 77
